server:
  host: "192.168.1.10"
  port: 8080
  timeout_seconds: 5.0

api:
  status_endpoint: "/api/status"
  result_endpoint: "/api/analysis"
  max_payload_bytes: 1048576  # 1 MB maximum payload length
  status_fallback: true       # tecWatch not reachable: GET /api/status returns the built-in simulated status ("source": "simulated")

analysis:
  report_path: "data/data-analysis-report.json"   # JSON report served by GET /api/analysis (relative to the backend folder)
  scenarios_path: "data/analysis-scenarios.json"  # Findings served by GET /api/analysis/scenarios
  max_report_bytes: 1048576                        # 1 MB maximum length of each analysis file
  max_upload_bytes: 52428800                       # 50 MB maximum size of each file uploaded for analysis (capture, test report)

gateway:
  listen_host: "0.0.0.0"
  listen_port: 8000
  log_level: "INFO"
  log_file: "logs/tecwatch_api.log"
